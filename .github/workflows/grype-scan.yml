name: Grype daily SBOM scan

on:
  schedule:
    # Run every morning at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write # required to upload SARIF to GitHub code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract SBOM and VEX from image attestations
        # Everything the scan needs comes from the image's own signed attestations
        # (nothing is read from the repo, so this workflow doesn't even check it out):
        #   - Syft-JSON SBOM (type https://syft.dev/bom): scanned instead of the
        #     CycloneDX one because it preserves the image source identity that
        #     image-scoped OpenVEX matching needs (CycloneDX drops it → VEX no-ops);
        #   - OpenVEX triage (type openvex): applied via Grype's --vex.
        # jq decodes the base64 payload and extracts the predicate (the raw document).
        #
        # CERT_REGEXP points at validate.yml, NOT release.yml. The image is built,
        # pushed and signed by the build-image job, which lives in the *reusable*
        # workflow validate.yml (release.yml only calls it). For a job that runs
        # inside a reusable workflow, the keyless OIDC certificate identity (SAN) is
        # the reusable workflow's ref, not the caller's, so the signer identity to
        # verify against is .github/workflows/validate.yml. It keeps the repository's
        # original case (the OIDC cert identity preserves it); IMAGE is lowercased
        # below (OCI refs must be).
        env:
          CERT_REGEXP: "^${{ github.server_url }}/${{ github.repository }}/.github/workflows/validate.yml@refs/"
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          verify() {  # $1 = predicate type -> stdout: the raw predicate JSON
            cosign verify-attestation \
              --type "$1" \
              --certificate-identity-regexp "${CERT_REGEXP}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${IMAGE}" \
              | jq -rs '.[0].payload | @base64d | fromjson | .predicate'
          }
          verify "https://syft.dev/bom" > /tmp/sbom.syft.json
          verify openvex                > /tmp/vex.openvex.json

      - name: Run Grype against SBOM
        # Scans the SBOM (not the live image) so results are reproducible and fast,
        # applying the OpenVEX pulled from the image. fail-build is false: findings
        # are surfaced via SARIF, not a job failure.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          sbom: /tmp/sbom.syft.json
          vex: /tmp/vex.openvex.json
          fail-build: "false"
          output-format: sarif

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
