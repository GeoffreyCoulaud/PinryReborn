name: Validate

# Reusable workflow: static analysis (detekt), tests and container image build.
# Called by the PR workflow (push=false) and the release workflow (push=true)
# so both run the exact same quality gate. Only the release path publishes the
# image to GHCR.
on:
  workflow_call:
    inputs:
      push:
        description: "Publish the container image to GHCR"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Detekt
        run: ./gradlew detekt
      - name: No long dashes
        # CI reproduces the gate's parts rather than calling `gate`, so a check added there is not
        # in CI until it is added here too.
        run: ./gradlew checkNoLongDashes

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Install libvips
        # api-imaging-vips's tests load the native libvips shared library.
        # ubuntu-latest (24.04, "noble") ships it under the t64-suffixed name
        # after the 64-bit time_t transition.
        run: sudo apt-get update && sudo apt-get install -y libvips42t64
      - name: Test and verify coverage
        # `test` runs every module's tests (including api-application's end-to-end
        # integration tests, which Kover does not cover); `koverVerify` then enforces
        # 100% branch coverage per in-gate module. Gradle runs the shared test tasks once.
        run: ./gradlew test koverVerify

  # Build the runtime image on every run so each PR verifies it still builds,
  # and publish to GHCR only when push=true (release path). The Quarkus fast-jar
  # artifact is built once with Gradle (JVM jars are arch-independent) then
  # buildx assembles the multi-arch manifest directly.
  build-image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for keyless cosign signing (only used when push=true)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build Quarkus artifact
        run: ./gradlew :api-application:quarkusBuild
      - name: OpenAPI document is in sync
        # The build above regenerates it, so this costs nothing here. The pre-commit hook does the
        # same locally, and a hook nobody installed regenerates nothing.
        run: git diff --exit-code -- docs/openapi.json
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/geoffreycoulaud/pinry-reborn-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern=v{{version}}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- SBOM generation and signed attestations (release path only) ---
      # Everything below runs only when push=true: there is no pushed image to
      # attest on PRs. GHCR/OCI refs must be lowercase, but github.repository
      # preserves the owner's original case (GeoffreyCoulaud); the SBOM/attest
      # steps reference the image by digest directly, so lowercase it here.
      - name: Compute lowercase image ref
        if: ${{ inputs.push }}
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate CycloneDX SBOM (standard, for external consumers)
        # Scans the final pushed image by digest; CycloneDX is the portable
        # interchange format consumers expect.
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: cyclonedx-json
          output-file: /tmp/sbom.cyclonedx.json
          upload-artifact: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Syft-JSON SBOM (native, for the VEX-aware daily scan)
        # Syft's native format preserves the image source identity
        # (ImageMetadata: tags + repoDigests). Grype needs that to resolve
        # image-scoped OpenVEX statements (pkg:oci/... products); CycloneDX
        # drops it, so the daily scan reads THIS SBOM, not the CycloneDX one.
        if: ${{ inputs.push }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.ref }}
          format: syft-json
          output-file: /tmp/sbom.syft.json
          upload-artifact: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest SBOMs and VEX (keyless OIDC via cosign)
        # Three signed attestations on the pushed image (needs id-token: write
        # for OIDC and packages: write to push to GHCR):
        #   - CycloneDX  : the standard SBOM for external consumers
        #   - Syft-JSON  : consumed by grype-scan.yml (preserves image identity
        #                  so image-scoped VEX filters correctly)
        #   - OpenVEX    : so anyone scanning this image directly inherits the
        #                  not_affected triage in security/vex.openvex.json
        if: ${{ inputs.push }}
        run: |
          ref='${{ steps.image.outputs.ref }}'
          cosign attest --yes --type cyclonedx \
            --predicate /tmp/sbom.cyclonedx.json "$ref"
          cosign attest --yes --type https://syft.dev/bom \
            --predicate /tmp/sbom.syft.json "$ref"
          cosign attest --yes --type openvex \
            --predicate security/vex.openvex.json "$ref"

  # Single required check. GitHub counts a skipped job as passing for branch
  # protection, so the gate always runs (if: always()) and fails explicitly
  # unless every needed job actually reported "success".
  gate:
    needs: [lint, test, build-image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Needed job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed (results: $results)"
              exit 1
            fi
          done
