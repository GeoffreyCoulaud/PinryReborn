name: PR

on:
  pull_request:

permissions:
  contents: read

# Cancel a previous run when new commits are pushed to the same PR
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name must stay "validate": branch protection requires the
  # "validate / gate" check produced by the reusable workflow's gate job.
  # push=false: the image is built (to verify it still builds) but not
  # published. packages:write and id-token:write are still required here
  # because the reusable workflow's build-image job declares them; the caller
  # must grant at least as much or the run fails to start (even though nothing
  # is pushed or signed on PRs).
  validate:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/validate.yml
    with:
      push: false

  # PR-only, informational check (not required by branch protection). Lints the
  # PR commit messages against .commitlintrc.json (config-conventional).
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the action can resolve the PR commit range.
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json
