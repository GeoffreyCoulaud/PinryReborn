[versions]
kotlin = "2.4.10"
quarkus = "3.37.3"
ebean = "19.3.0"
ebean-migration = "14.3.0"
junit = "6.1.2"
mockk = "1.14.11"
sqlite-jdbc = "3.53.2.0"
jakarta-cdi = "4.1.0"
jakarta-ws-rs = "4.0.0"
jakarta-inject = "2.0.1"
jakarta-transaction = "2.0.1"
jandex = "2.3.0"
kotlin-logging = "8.0.4"
jbcrypt = "0.4"
commons-text = "1.15.0"
smallrye-config = "3.18.1"
quarkus-junit = "3.37.3"
rest-assured = "6.0.1"
detekt = "2.0.0-alpha.5"
kover = "0.9.9"
konsist = "0.17.3"
vips-ffm = "1.9.8"

[libraries]
# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
quarkus-junit = { module = "io.quarkus:quarkus-junit5", version.ref = "quarkus-junit" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

# Ebean ORM
ebean = { module = "io.ebean:ebean", version.ref = "ebean" }
ebean-sqlite = { module = "io.ebean:ebean-sqlite", version.ref = "ebean" }
ebean-ddl-generator = { module = "io.ebean:ebean-ddl-generator", version.ref = "ebean" }
ebean-migration = { module = "io.ebean:ebean-migration", version.ref = "ebean-migration" }
ebean-querybean-generator = { module = "io.ebean:kotlin-querybean-generator", version.ref = "ebean" }
ebean-test = { module = "io.ebean:ebean-test", version.ref = "ebean" }

# Jakarta APIs
jakarta-cdi-api = { module = "jakarta.enterprise:jakarta.enterprise.cdi-api", version.ref = "jakarta-cdi" }
jakarta-ws-rs-api = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version.ref = "jakarta-ws-rs" }
jakarta-inject-api = { module = "jakarta.inject:jakarta.inject-api", version.ref = "jakarta-inject" }
jakarta-transaction-api = { module = "jakarta.transaction:jakarta.transaction-api", version.ref = "jakarta-transaction" }

# Quarkus
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-arc = { module = "io.quarkus:quarkus-arc" }
quarkus-core = { module = "io.quarkus:quarkus-core" }
quarkus-kotlin = { module = "io.quarkus:quarkus-kotlin" }
quarkus-rest = { module = "io.quarkus:quarkus-rest" }
quarkus-rest-jackson = { module = "io.quarkus:quarkus-rest-jackson" }
quarkus-security = { module = "io.quarkus:quarkus-security" }
quarkus-smallrye-openapi = { module = "io.quarkus:quarkus-smallrye-openapi" }
quarkus-smallrye-health = { module = "io.quarkus:quarkus-smallrye-health" }
quarkus-hibernate-validator = { module = "io.quarkus:quarkus-hibernate-validator" }
quarkus-micrometer = { module = "io.quarkus:quarkus-micrometer" }
quarkus-micrometer-registry-prometheus = { module = "io.quarkus:quarkus-micrometer-registry-prometheus" }
smallrye-config = { module = "io.smallrye.config:smallrye-config", version.ref = "smallrye-config" }
resteasy-reactive-common = { module = "io.quarkus.resteasy.reactive:resteasy-reactive-common", version.ref = "quarkus" }
resteasy-reactive = { module = "io.quarkus.resteasy.reactive:resteasy-reactive", version.ref = "quarkus" }

# Jackson (version from Quarkus BOM)
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

# Logging
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
slf4j-jboss-logmanager = { module = "org.jboss.slf4j:slf4j-jboss-logmanager" }

# Other
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8" }

jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commons-text" }

vips-ffm-core = { module = "app.photofox.vips-ffm:vips-ffm-core", version.ref = "vips-ffm" }

[bundles]
testing = [
    "junit-jupiter",
    "mockk"
]
testing-runtime = [
    "junit-platform-launcher"
]
integration-testing = [
    "quarkus-junit",
    "rest-assured"
]
quarkus-runtime = [
    "quarkus-arc",
    "quarkus-kotlin",
    "quarkus-rest",
    "quarkus-rest-jackson",
    "quarkus-security"
]
quarkus-compileOnly = [
    "resteasy-reactive-common",
    "resteasy-reactive",
    "jackson-databind",
    "jakarta-ws-rs-api",
    "jakarta-inject-api",
    "jakarta-cdi-api"
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
kotlin-noarg = { id = "org.jetbrains.kotlin.plugin.noarg", version.ref = "kotlin" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
ebean = { id = "io.ebean", version.ref = "ebean" }
jandex = { id = "org.kordamp.gradle.jandex", version.ref = "jandex" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }