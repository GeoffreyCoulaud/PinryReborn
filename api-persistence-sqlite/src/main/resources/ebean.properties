# Ebean Configuration

# Disable DDL generation (use migrations instead)
ebean.db.ddl.generate=false
ebean.db.ddl.run=false

# Enable migrations
ebean.migration.run=true
ebean.migration.path=dbmigration

# SQLite datasource
#
# Mirrors 3 of the 4 queue pragmas from EbeanDatabaseProducer.sqliteJdbcUrl (see its KDoc):
# journal_mode=WAL, synchronous=NORMAL and busy_timeout are safe with Ebean's default
# multi-connection pool. transaction_mode=IMMEDIATE is deliberately NOT mirrored here: every
# pooled JDBC connection gets autoCommit(false), which under IMMEDIATE begins each connection's
# transaction with an eager write-lock grab. Ebean's default pool opens more than one connection
# against this same on-disk file (this properties file also backs the DB.getDefault() path used
# by RepositoryTest-derived unit tests and the generateDbMigration tool), so a second connection
# blocks for busy_timeout then fails with SQLITE_BUSY -- surfaced by ebean-datasource as an
# unrelated NullPointerException in ConnectionPool.notifyDataSourceIsDown that masks the real
# cause. Only apply IMMEDIATE once the datasource is constrained to a single connection (planned
# in the concurrency task), or wire it through EbeanDatabaseProducer alone (single Database bean).
datasource.db.username=sa
datasource.db.password=
datasource.db.url=jdbc:sqlite:${DB_PATH:data.db}?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000
datasource.db.driver=org.sqlite.JDBC

# Entity packages to scan
ebean.packages=fr.geoffreyCoulaud.pinryReborn.api.persistence.sqlite.models
