# Ebean Configuration

# Disable DDL generation (use migrations instead)
ebean.db.ddl.generate=false
ebean.db.ddl.run=false

# Enable migrations
ebean.migration.run=true
ebean.migration.path=dbmigration

# SQLite datasource
#
# Mirrors the queue pragmas from EbeanDatabaseProducer.sqliteJdbcUrl (see its KDoc):
# journal_mode=WAL, synchronous=NORMAL and busy_timeout. transaction_mode=IMMEDIATE is
# deliberately NOT mirrored here (nor set on the production datasource): the option-A decision
# constrains the SQLite datasource to a single connection (see EbeanDatabaseProducer's
# minConnections/maxConnections=1), so there is no pool contention and IMMEDIATE's eager
# write-lock grab is unnecessary -- it previously reintroduced a deadlock when a second pooled
# connection (this properties file also backs the DB.getDefault() path used by
# RepositoryTest-derived unit tests) blocked for busy_timeout then failed with SQLITE_BUSY,
# surfaced by ebean-datasource as an unrelated NullPointerException in
# ConnectionPool.notifyDataSourceIsDown that masked the real cause. A single connection already
# serializes writes, which is all SQLite (a single-writer database) requires.
datasource.db.username=sa
datasource.db.password=
datasource.db.url=jdbc:sqlite:${DB_PATH:data.db}?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000
datasource.db.driver=org.sqlite.JDBC

# Entity packages to scan
ebean.packages=fr.geoffreyCoulaud.pinryReborn.api.persistence.sqlite.models
