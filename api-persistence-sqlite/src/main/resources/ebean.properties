# Ebean Configuration

# Disable DDL generation (use migrations instead)
ebean.db.ddl.generate=false
ebean.db.ddl.run=false

# Enable migrations
ebean.migration.run=true
ebean.migration.path=dbmigration

# SQLite datasource
#
# Mirrors the production datasource.db.url from
# api-application/src/main/resources/application.properties (the Quarkus path) so the avaje-config
# DB.getDefault() path used by RepositoryTest-derived unit tests gets the same SQLite pragmas:
# journal_mode=WAL, synchronous=NORMAL and busy_timeout. transaction_mode=IMMEDIATE is deliberately
# NOT set here (nor on the production datasource): the option-A decision constrains the SQLite
# datasource to a single connection (see EbeanDatabaseProducer's minConnections/maxConnections=1),
# so there is no pool contention and IMMEDIATE's eager write-lock grab is unnecessary. It
# previously reintroduced a deadlock when a second pooled connection blocked for busy_timeout then
# failed with SQLITE_BUSY, surfaced by ebean-datasource as an unrelated NullPointerException in
# ConnectionPool.notifyDataSourceIsDown that masked the real cause. A single connection already
# serializes writes, which is all SQLite (a single-writer database) requires.
datasource.db.username=sa
datasource.db.password=
datasource.db.url=jdbc:sqlite:${DB_PATH:data.db}?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000
datasource.db.driver=org.sqlite.JDBC

# Entity packages to scan
ebean.packages=fr.geoffreyCoulaud.pinryReborn.api.persistence.sqlite.models
