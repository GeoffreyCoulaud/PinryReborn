# Test datasource override for the repository test suite (RepositoryTest-derived classes,
# which use `DB.getDefault()`).
#
# Naming matters: avaje-config (which Ebean's implicit `DB.getDefault()` bootstrap uses) only
# looks for a test overlay named `application-test.properties`/`.yaml` (or the deprecated
# `test-ebean.properties`) -- see io.avaje.config.InitialLoader#loadTest(). The previous name
# `ebean-test.properties` matched neither, so it was silently never loaded and the repository
# tests actually ran on `ebean.properties`'s on-disk `data.db`. Renaming to this file is what
# makes the override below take effect.
#
# Isolated, single-connection in-memory SQLite: `jdbc:sqlite::memory:` is only safe with exactly
# one connection (each SQLite connection otherwise gets its OWN private in-memory database), so
# maxConnections/minConnections are pinned to 1 here, mirroring the option-A production
# datasource (see EbeanDatabaseProducer). This also keeps every test run isolated from previous
# runs and from any other module, with no shared on-disk file.
datasource.db.url=jdbc:sqlite::memory:
datasource.db.driver=org.sqlite.JDBC
datasource.db.username=sa
datasource.db.password=
datasource.db.minConnections=1
datasource.db.maxConnections=1

ebean.migration.run=true
ebean.migration.path=dbmigration
ebean.packages=fr.geoffreyCoulaud.pinryReborn.api.persistence.sqlite.models
