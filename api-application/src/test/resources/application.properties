ebean.test.platform=sqlite
ebean.test.ddlMode=none
ebean.test.dbName=test

# `jdbc:sqlite::memory:` is only safe with exactly one connection: each SQLite connection otherwise
# gets its OWN private in-memory database, so the connection that ran the migrations is not the one
# a query lands on ("no such table: tasks"). The default Database has two creation paths here (the
# CDI producer, and avaje-config when a query bean reaches DB.getDefault() first) and the winner is
# whoever runs first, so the pool is pinned in both. The producer pins it in code
# (EbeanDatabaseProducer, option A); these two lines pin the avaje-config path to the same thing.
datasource.db.url=jdbc:sqlite::memory:
datasource.db.driver=org.sqlite.JDBC
datasource.db.username=sa
datasource.db.password=
datasource.db.minConnections=1
datasource.db.maxConnections=1

ebean.migration.run=true
ebean.migration.path=dbmigration
ebean.packages=fr.geoffreyCoulaud.pinryReborn.api.persistence.sqlite.models

# CORS: pin a deterministic single allowed origin so CorsIntegrationTest is decoupled
# from the dev default in the main application.properties.
api.cors.origins=https://app.test

# AuthConfig override: disable the password-change minimum interval so MePasswordIntegrationTest
# success paths stay green (the seed hash is fresh at signup).
auth.password_change_minimum_interval=PT0S

# Task queue (TaskQueueConfig uses the SNAKE_CASE naming strategy: underscores, not dashes) -
# fast poll so TaskQueueBootIntegrationTest's bounded wait is quick.
tasks.worker_count=4
tasks.poll_interval=PT0.05S
tasks.lease_duration=PT1M
tasks.backoff_base=PT1S
tasks.backoff_cap=PT5M
tasks.default_max_attempts=5
tasks.shutdown_drain_timeout=PT20S