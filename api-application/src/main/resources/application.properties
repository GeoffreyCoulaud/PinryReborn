# API Configuration
api.host=0.0.0.0
api.port=8080
api.remote_host=${api.host}
# Quarkus Configuration
quarkus.http.host=${api.host}
quarkus.http.port=${api.port}
# CORS: browser clients (SPA, later the extension) hit the API cross-origin.
# Bearer auth via the Authorization header only (no cookies), so credentials stay off.
# api.cors.origins is the public knob (declared in ApiConfig); prod overrides API_CORS_ORIGINS.
quarkus.http.cors.enabled=true
api.cors.origins=http://localhost:5173
quarkus.http.cors.origins=${api.cors.origins}
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-max-age=PT24H
# Session-token auth (AuthConfig uses the SNAKE_CASE naming strategy: underscores, not dashes)
auth.persistent_ttl=P30D
auth.ephemeral_ttl=PT12H
auth.renew_threshold=0.75
# OpenAPI - generate spec at build time, disable runtime endpoint in prod
quarkus.smallrye-openapi.store-schema-directory=../docs
%prod.quarkus.smallrye-openapi.enabled=false
# Task queue (TaskQueueConfig uses the SNAKE_CASE naming strategy: underscores, not dashes)
tasks.worker_count=4
tasks.poll_interval=PT1S
tasks.lease_duration=PT1M
tasks.backoff_base=PT1S
tasks.backoff_cap=PT5M
tasks.default_max_attempts=5
tasks.shutdown_drain_timeout=PT20S
# Image hosting (ImagesConfig uses the SNAKE_CASE naming strategy: underscores, not dashes)
images.data_dir=/var/lib/pinry/images
images.max_file_bytes=31457280
images.max_pixels=50000000
# Multipart backstop: allow bodies slightly above images.max_file_bytes so the
# precise 30 MiB limit is enforced by the use case (413), not the framework.
quarkus.http.limits.max-body-size=32M
# Rendition (thumbnail) sizes, in px on the image's SHORTEST side. Clients request a size by name
# (?size=tiny|small|medium|large); an original already that small is served as-is, never upscaled.
images.renditions.tiny=112
images.renditions.small=240
images.renditions.medium=480
images.renditions.large=960
# WebP encode quality (0-100) for every generated rendition.
images.renditions.webp_quality=80
# Server-side image download (mode B). request_timeout + connect_timeout must stay < tasks.lease_duration.
images.download.connect_timeout=PT5S
images.download.request_timeout=PT30S
images.download.max_redirects=5
# Only enable on trusted networks: allows fetching from private/loopback addresses (disables the SSRF guard).
images.download.allow_private_addresses=false
